<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script>if(/\/admin$/.test(location.pathname))location.replace(location.pathname+"/"+location.search+location.hash);</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'sha256-F6pnSuJmNsOFBThdz+zcwvgp+VbgGx67aaoaAFGscT0='; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <meta name="theme-color" content="#0B1F5C" />
  <title>Bookings – BMReddy Travels Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body class="admin is-checking">

  <svg width="0" height="0" class="sprite" aria-hidden="true">
    <defs>
      <symbol id="i-phone" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></symbol>
      <symbol id="i-whatsapp" viewBox="0 0 24 24"><path stroke="none" fill="currentColor" d="M17.5 14.4c-.3-.1-1.7-.8-2-.9-.3-.1-.5-.1-.7.1-.2.3-.8.9-.9 1.1-.2.2-.3.2-.6.1-.3-.1-1.2-.5-2.3-1.4-.9-.8-1.4-1.7-1.6-2-.2-.3 0-.5.1-.6l.4-.5c.2-.2.2-.3.3-.5.1-.2 0-.4 0-.5l-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.4s1 2.8 1.2 3c.1.2 2 3.1 4.9 4.3 2.4 1 2.9.8 3.4.7.5-.1 1.7-.7 2-1.4.2-.7.2-1.2.2-1.4-.1-.1-.3-.2-.6-.3zM12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.6 0-3.1-.4-4.4-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2z"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
      <symbol id="i-car" viewBox="0 0 24 24"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></symbol>
      <symbol id="i-user" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
      <symbol id="i-filter" viewBox="0 0 24 24"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></symbol>
    </defs>
  </svg>

  <header class="admin-top">
    <div class="container">
      <a class="admin-logo" href="./">
        <span class="logo-mark" aria-hidden="true">B</span>
        <span class="logo-text">BMReddy <span>Admin</span></span>
      </a>
      <button type="button" class="btn btn-logout" id="logout">Log out</button>
    </div>
  </header>

  <p class="checking-msg" role="status">Checking your login…</p>

  <main class="container admin-main" id="app">

    <!-- Summary cards (tap to filter) -->
    <section class="stats" aria-label="Summary">
      <button type="button" class="stat stat-total" data-stat="all"><span>Total bookings</span><strong id="st-total">–</strong></button>
      <button type="button" class="stat stat-today" data-stat="today"><span>New today</span><strong id="st-today">–</strong></button>
      <button type="button" class="stat stat-confirmed" data-stat="Confirmed"><span>Confirmed</span><strong id="st-confirmed">–</strong></button>
      <button type="button" class="stat stat-cancelled" data-stat="Cancelled"><span>Cancelled</span><strong id="st-cancelled">–</strong></button>
    </section>

    <nav class="tabs" role="tablist" aria-label="Views">
      <button type="button" role="tab" id="tab-bookings" aria-selected="true" aria-controls="panel-bookings">Bookings</button>
      <button type="button" role="tab" id="tab-history" aria-selected="false" aria-controls="panel-history">History</button>
      <button type="button" role="tab" id="tab-activity" aria-selected="false" aria-controls="panel-activity">Activity log</button>
    </nav>

    <!-- Bookings -->
    <section id="panel-bookings" role="tabpanel" aria-labelledby="tab-bookings">
      <div class="panel toolbar">
        <div class="search">
          <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
          <label for="q" class="sr-only">Search by name or mobile number</label>
          <input id="q" type="search" placeholder="Name or mobile number" autocomplete="off" />
        </div>

        <details class="filters" id="filters">
          <summary>
            <svg class="icon" aria-hidden="true"><use href="#i-filter"/></svg>
            Filters <span class="filter-count" id="filter-count" hidden></span>
          </summary>
          <div class="filter-grid">
            <div class="field">
              <label for="f-status">Status</label>
              <select id="f-status">
                <option value="">All</option>
                <option>New</option>
                <option>Confirmed</option>
                <option>Completed</option>
                <option>Cancelled</option>
              </select>
            </div>
            <div class="field">
              <label for="f-car">Car</label>
              <select id="f-car"><option value="">All cars</option></select>
            </div>
            <div class="field full">
              <label for="f-dateby">Date range by</label>
              <select id="f-dateby">
                <option value="pickup">Pickup date</option>
                <option value="received">Date received</option>
              </select>
            </div>
            <div class="field">
              <label for="f-from">From</label>
              <input id="f-from" type="date" />
            </div>
            <div class="field">
              <label for="f-to">To</label>
              <input id="f-to" type="date" />
            </div>
          </div>
          <button type="button" class="btn btn-ghost btn-block" id="clear-filters">Clear all filters</button>
        </details>
      </div>

      <div class="list-head">
        <p id="count" aria-live="polite"></p>
        <button type="button" class="btn btn-navy btn-sm" id="export">
          <svg class="icon" aria-hidden="true"><use href="#i-download"/></svg> <span id="export-label">Export CSV</span>
        </button>
      </div>
      <p class="submit-error" id="list-error" role="alert" hidden></p>
      <div class="list" id="list"><p class="empty">Loading bookings…</p></div>
      <button type="button" class="btn btn-ghost btn-block" id="more" hidden>Show more</button>
    </section>

    <!-- History: every booking as a table -->
    <section id="panel-history" role="tabpanel" aria-labelledby="tab-history" hidden>
      <div class="panel toolbar">
        <div class="search">
          <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
          <label for="hq" class="sr-only">Search by name, mobile or email</label>
          <input id="hq" type="search" placeholder="Name, mobile or email" autocomplete="off" />
        </div>
      </div>
      <div class="list-head">
        <p id="h-count" aria-live="polite"></p>
        <p class="muted h-tip">Tap a row to open the booking.</p>
      </div>
      <div class="table-wrap">
        <table class="h-table">
          <thead>
            <tr>
              <th scope="col">#</th>
              <th scope="col">Received</th>
              <th scope="col">Name</th>
              <th scope="col">Mobile</th>
              <th scope="col">Email</th>
              <th scope="col">Car</th>
              <th scope="col">Pickup date</th>
              <th scope="col">Days</th>
              <th scope="col">Driver</th>
              <th scope="col">Pickup / destination</th>
              <th scope="col">Customer notes</th>
              <th scope="col">Total</th>
              <th scope="col">Status</th>
            </tr>
          </thead>
          <tbody id="h-rows"></tbody>
        </table>
      </div>
      <button type="button" class="btn btn-ghost btn-block" id="h-more" hidden>Show more</button>
    </section>

    <!-- Activity log -->
    <section id="panel-activity" role="tabpanel" aria-labelledby="tab-activity" hidden>
      <div class="panel">
        <h2 class="panel-title">Recent activity</h2>
        <p class="muted">New bookings and status changes, newest first.</p>
        <p class="submit-error" id="activity-error" role="alert" hidden></p>
        <ol class="timeline" id="activity"></ol>
      </div>
    </section>
  </main>

  <!-- Booking details -->
  <dialog class="sheet" id="detail" aria-labelledby="dt-name">
    <div id="detail-body"></div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
  <script src="../config.js"></script>
  <script src="common.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
