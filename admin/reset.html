<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <meta name="theme-color" content="#0B1F5C" />
  <title>Set new password – BMReddy Travels</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body class="auth">

  <svg width="0" height="0" class="sprite" aria-hidden="true">
    <defs>
      <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
    </defs>
  </svg>

  <main class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo">
        <span class="logo-mark" aria-hidden="true">B</span>
        <span class="logo-text">BMReddy <span>Admin</span></span>
      </div>

      <p class="auth-sub" id="checking">Checking your link…</p>
      <p id="msg" hidden></p>

      <form id="reset" novalidate hidden>
        <h1>Set a new password</h1>
        <p class="auth-sub">Use at least 8 characters. A mix of words and numbers is best.</p>
        <div class="field">
          <label for="pw1">New password</label>
          <input id="pw1" type="password" autocomplete="new-password" minlength="8" required />
        </div>
        <div class="field">
          <label for="pw2">Type it again</label>
          <input id="pw2" type="password" autocomplete="new-password" minlength="8" required />
        </div>
        <button type="submit" class="btn btn-red btn-lg btn-block" id="reset-btn">Save new password</button>
      </form>

      <a class="link-btn" href="login.html" id="back" hidden>Back to sign in</a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
  <script src="../config.js"></script>
  <script src="common.js"></script>
  <script src="reset.js"></script>
</body>
</html>
